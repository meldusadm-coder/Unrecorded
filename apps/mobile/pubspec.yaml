name: unrecorded_mobile
description: Unrecorded — detect possible nearby smart glasses and wearable recording devices.
publish_to: none
version: 0.9.4+20

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.22.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  flutter_blue_plus: ^2.3.11
  permission_handler: ^13.0.0
  shared_preferences: ^2.5.5
  shared_preferences_android: ^2.4.27
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  home_widget: ^0.9.3
  unrecorded_core:
    path: ../../packages/unrecorded_core
  unrecorded_radio:
    path: ../../packages/unrecorded_radio
  unrecorded_ui:
    path: ../../packages/unrecorded_ui
  flutter_svg: ^2.0.17
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.3.0
  flutter_foreground_task: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # Launcher PNGs live under assets/brand/ for flutter_launcher_icons only;
  # they are not bundled as Flutter assets (see docs/brand-review.md).

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_accent.png
  adaptive_icon_background: "#5B4DFF"
  adaptive_icon_foreground: assets/brand/logo_mark_foreground.png
