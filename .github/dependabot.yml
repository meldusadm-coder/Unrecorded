version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/site
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
